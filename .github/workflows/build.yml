name: Build it

on:
  push:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: poiman
          POSTGRES_PASSWORD: poiman
          POSTGRES_DB: poiman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poiman"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://poiman:poiman@localhost:5432/poiman
      DISABLE_AUTH: "true"
      NODE_ENV: development
      PORT: "8080"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

      - name: Start poiman server in background
        # nohup + disown + </dev/null detaches from the step's shell so the
        # process survives across steps. A bare `&` is technically an
        # orphan and can be reaped when the step's bash exits.
        run: nohup bun src/server/server.ts > server.log 2>&1 < /dev/null & disown

      - name: Wait for /liveness
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/liveness > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server didn't come up; log:"
          cat server.log
          exit 1

      - run: bun test

      - name: Server log
        if: always()
        run: cat server.log || true

  docker-build:
    needs: [test, lint]
    uses: entur/gha-docker/.github/workflows/build.yml@v1

  docker-push:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: docker-build
    uses: entur/gha-docker/.github/workflows/push.yml@v1

  scan:
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  deploy-dev:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: docker-push
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: dev
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag }}
      chart: helm/poiman
      namespace: poiman
      release_name: poiman
    secrets: inherit

  approval-tst:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"

  deploy-tst:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [docker-push, approval-tst]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: tst
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag }}
      chart: helm/poiman
      namespace: poiman
      release_name: poiman
    secrets: inherit

  approval-prd:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-tst
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"

  deploy-prd:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [docker-push, approval-prd]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: prd
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag }}
      chart: helm/poiman
      namespace: poiman
      release_name: poiman
    secrets: inherit
