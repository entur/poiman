name: Build it

on:
  push:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  docker-build:
    needs: [test, lint]
    uses: entur/gha-docker/.github/workflows/build.yml@v1

  docker-push:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: docker-build
    uses: entur/gha-docker/.github/workflows/push.yml@v1

  scan:
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  deploy-dev:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: docker-push
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: dev
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag }}
      chart: helm/poiman
      namespace: poiman
      release_name: poiman
    secrets: inherit

  approval-tst:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"

  deploy-tst:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [docker-push, approval-tst]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: tst
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag }}
      chart: helm/poiman
      namespace: poiman
      release_name: poiman
    secrets: inherit

  approval-prd:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-tst
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"

  deploy-prd:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [docker-push, approval-prd]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: prd
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag }}
      chart: helm/poiman
      namespace: poiman
      release_name: poiman
    secrets: inherit
