name: Build it

on:
  push:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: poiman
          POSTGRES_PASSWORD: poiman
          POSTGRES_DB: poiman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poiman"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://poiman:poiman@localhost:5432/poiman
      DISABLE_AUTH: "true"
      NODE_ENV: development
      PORT: "8080"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

      - name: Start poiman server in background
        # nohup + disown + </dev/null detaches from the step's shell so the
        # process survives across steps. A bare `&` is technically an
        # orphan and can be reaped when the step's bash exits.
        run: nohup bun src/server/server.ts > server.log 2>&1 < /dev/null & disown

      - name: Wait for /liveness
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/liveness > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server didn't come up; log:"
          cat server.log
          exit 1

      - run: bun test

      - name: Server log
        if: always()
        run: cat server.log || true

  # Plain build: gha-docker's build.yml requires GCP credentials, which this
  # public repo does not have. The artifact layout matches what docker-scan
  # expects (artifact `poiman` holding `poiman.tar`).
  docker-build:
    needs: [test, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image_artifact: poiman
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: poiman
          outputs: type=docker,dest=/tmp/poiman.tar
          push: false
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=max,ignore-error=true
      - uses: actions/upload-artifact@v7
        with:
          name: poiman
          path: /tmp/poiman.tar
          retention-days: 1

  scan:
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  # Build, push and deploy happen in the private entur/poiman-deployment-config.
  trigger-deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'entur' }}
    needs: [docker-build, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-trigger
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        # REST dispatch with an explicit ref: the token only has Actions access,
        # which `gh workflow run`'s default-branch lookup can't use.
        run: |
          gh api -X POST repos/entur/poiman-deployment-config/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f "inputs[sha]=$GITHUB_SHA"
