name: Build it

on:
  push:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@a1d476b895a271d0fe8557f1b763529b64fb0554 # v1.14.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: poiman
          POSTGRES_PASSWORD: poiman
          POSTGRES_DB: poiman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poiman"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://poiman:poiman@localhost:5432/poiman
      DISABLE_AUTH: "true"
      NODE_ENV: development
      PORT: "8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

      - name: Start poiman server in background
        # nohup + disown + </dev/null detaches from the step's shell so the
        # process survives across steps. A bare `&` is technically an
        # orphan and can be reaped when the step's bash exits.
        run: nohup bun src/server/server.ts > server.log 2>&1 < /dev/null & disown

      - name: Wait for /liveness
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/liveness > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server didn't come up; log:"
          cat server.log
          exit 1

      - run: bun test

      - name: Server log
        if: always()
        run: cat server.log || true

  # The image entur/poiman-deployment-config scans, pushes to GAR and deploys
  # (it downloads the `poiman` artifact from this run). No GCP: the job only
  # gets id-token because gha-docker's build.yml asks for it.
  docker-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [test, lint]
    permissions:
      contents: read
      id-token: write
    uses: entur/gha-docker/.github/workflows/build.yml@a1d476b895a271d0fe8557f1b763529b64fb0554 # v1.14.0
    with:
      authenticate: false

  scan:
    needs: [docker-build]
    # What docker-scan.yml asks for: SARIF upload, PR comment, issues.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      security-events: write
      actions: read
    uses: entur/gha-security/.github/workflows/docker-scan.yml@0962fb4f3f9004eeaea88582db8639e140ec6fda # v2.17.1
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  # Push and deploy happen in the internal entur/poiman-deployment-config.
  trigger-deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'entur' }}
    needs: [test, lint, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-trigger
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        # REST dispatch with an explicit ref: the token only has Actions access,
        # which `gh workflow run`'s default-branch lookup can't use. A missing
        # run link must not fail the job once the dispatch went through.
        run: |
          out=$(gh api -X POST repos/entur/poiman-deployment-config/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f "inputs[run_id]=$GITHUB_RUN_ID" -F return_run_details=true)
          url=$(jq -r '.html_url // empty' <<<"$out" 2>/dev/null || true)
          echo "Deploy run: ${url:-https://github.com/entur/poiman-deployment-config/actions/workflows/deploy.yml}" | tee -a "$GITHUB_STEP_SUMMARY"
