publiccodeYmlVersion: "0.7.0"

name: poiman
url: https://github.com/entur/poiman

platforms:
  - web
  - linux

categories:
  - geographic-information-systems
  - content-management

developmentStatus: stable
softwareType: standalone/web

organisation:
  name: Entur AS
  uri: https://entur.no

usedBy:
  - Norway (nationwide), Entur AS

intendedAudience:
  scope:
    - transportation
  countries:
    - "NO"

description:
  en:
    localisedName: poiman
    shortDescription: Editor for points of interest served as NeTEx to the Entur geocoder.
    longDescription: >
      poiman is a web editor for points of interest such as event venues. Edits are stored in PostgreSQL and served
      immediately as NeTEx, which the geocoder import reads.
    documentation: https://github.com/entur/poiman/blob/main/README.md
    features:
      - Map-based editing of points of interest
      - Live NeTEx export
      - NeTEx import in merge or replace mode
      - Login restricted to a list of editors

