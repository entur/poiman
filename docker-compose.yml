services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: poiman
      POSTGRES_PASSWORD: poiman
      POSTGRES_DB: poiman
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ stores data in a major-version subdirectory of
      # /var/lib/postgresql (so pg_upgrade works inside the mount), so
      # mount the volume one level up instead of at .../data.
      - poiman-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poiman"]
      interval: 2s
      timeout: 2s
      retries: 10

  poiman:
    build:
      context: .
      target: dev  # shell-bearing stage; the distroless prod image has no sh
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://poiman:poiman@postgres:5432/poiman
      PORT: 8080
      NODE_ENV: development
      # DISABLE_AUTH=true short-circuits Auth0 and stamps every request
      # as `dev@local`. To test the real Auth0 flow locally, drop a .env
      # next to this file with:
      #   DISABLE_AUTH=false
      #   OIDC_AUTHORITY=https://partner.dev.entur.org
      #   OIDC_AUDIENCE=https://api.dev.entur.io
      #   OIDC_CLIENT_ID=<dev SPA client id from Secret Manager>
      #   EDITORS=<comma-separated emails>
      # The dev Auth0 client already allows http://localhost:8080.
      DISABLE_AUTH: ${DISABLE_AUTH:-true}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      EDITORS: ${EDITORS:-}
    ports:
      - "8080:8080"
    # Bind-mount the source so `bun --watch` and `bun build --watch`
    # pick up local edits. The image's baked-in /app/node_modules is
    # untouched.
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
    command:
      - sh
      - -c
      - |
        bun build src/client/main.tsx --outdir dist/client --target browser --sourcemap --watch &
        exec bun --watch src/server/server.ts

volumes:
  poiman-pg:
