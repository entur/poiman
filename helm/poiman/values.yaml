common:
  app: poiman
  shortname: poiman
  team: team-ror
  ingress:
    enabled: true
  service:
    internalPort: 8080
  deployment:
    prometheus:
      enabled: true
      path: /metrics
      port: 8080
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0%
        maxSurge: 25%
    minReadySeconds: 10
  container:
    image: <+artifacts.primary.image>
    imagePullPolicy: Always
    cpu: 0.1
    memory: 256
    probes:
      enabled: true
      spec:
        startupProbe:
          httpGet:
            path: /liveness
            port: 8080
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
    lifecycle:
      preStop:
        exec:
          command: ["/bin/sh", "-c", "sleep 5"]
  postgres:
    enabled: true
  configmap:
    enabled: true
    toEnv: true
    data:
      # Auth0 / OIDC bootstrap. All three values are public; they're also
      # echoed to the browser via /config.json so the SPA can log in.
      # Set the env-specific values in values-kub-ent-{dev,tst,prd}.yaml.
      OIDC_AUTHORITY: ""
      OIDC_CLIENT_ID: ""
      OIDC_AUDIENCE: ""
