common:
  app: poiman
  appId: poiman
  team: team-ror
  ingress:
    enabled: true
  service:
    internalPort: 8080
  deployment:
    prometheus:
      enabled: true
      path: /metrics
      port: 8080
    maxUnavailable: 0%
    maxSurge: 25%
    minReadySeconds: 10
  container:
    image: <+artifacts.primary.image>
    cpu: 0.1
    memory: 256
    probes:
      enabled: true
      spec:
        startupProbe:
          httpGet:
            path: /liveness
            port: 8080
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
    lifecycle:
      preStop:
        # Native sleep handler (k8s 1.30+): the distroless image has no /bin/sh
        # for an exec hook. Allows time for connections to drain before SIGTERM.
        sleep:
          seconds: 1
  postgres:
    enabled: true
    memory: 64  # cloud-sql-proxy v2 sidecar; default 16 is tight under a connection pool
    instances:
      - secretKeyPrefix: PG  # must match terraform-google-sql-db secret_key_prefix (default PG)
  configmap:
    enabled: true
    data:
      # Auth0 / OIDC bootstrap. Both values are env-specific and echoed
      # to the browser via /config.json so the SPA can log in. The third
      # piece, OIDC_CLIENT_ID, comes from Secret Manager - see the
      # `secrets:` block below.
      OIDC_AUTHORITY: ""
      OIDC_AUDIENCE: ""
      # Set to "true" to skip Auth0 entirely - all requests are stamped
      # as `dev@local` (override via the `DEV_USER` env var). Local dev
      # sets this in docker-compose.yml; the server logs a loud WARNING
      # whenever it boots with auth disabled.
      DISABLE_AUTH: "false"
  secrets:
    # Per-env Auth0 SPA client_id, fetched from Secret Manager. Each
    # GCP project (dev/tst/prd) must have a SM key named OIDC_CLIENT_ID
    # holding the right SPA client. See terraform/ + the cutover plan
    # in README.md.
    oidc-credentials:
      - OIDC_CLIENT_ID
